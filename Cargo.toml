[package]
name = "deelixir-wm"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { git = "https://github.com/Smithay/smithay.git", branch = "master", features = [
    "backend_winit",
    "desktop",
    "wayland_frontend",
    "xwayland",
    "renderer_gl",
] }

wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }